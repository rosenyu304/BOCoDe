name: Benchmark Testing

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[tests]

      - name: Run Tests
        run: |
          python -m pytest